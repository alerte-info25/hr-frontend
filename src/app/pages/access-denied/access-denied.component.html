<div class="denied-container">
  <!-- Formes décoratives de fond -->
  <div class="bg-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="denied-card">
    <!-- Badge supérieur -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Erreur 403</span>
    </div>

    <!-- Illustration / Icône -->
    <div class="illustration">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="shield-svg">
        <!-- Bouclier -->
        <path class="shield-path" d="M100 20 L160 45 V100 C160 140 130 170 100 180 C70 170 40 140 40 100 V45 L100 20Z"
              stroke="url(#gradient)" stroke-width="2.5" fill="rgba(59, 130, 246, 0.04)" stroke-linejoin="round"/>
        <!-- Cadenas -->
        <rect class="lock-body" x="80" y="95" width="40" height="32" rx="4"
              fill="url(#gradient)" opacity="0.9"/>
        <path class="lock-shackle" d="M88 95 V85 a12 12 0 0 1 24 0 V95"
              stroke="url(#gradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle class="lock-keyhole" cx="100" cy="109" r="3" fill="white"/>
        <rect class="lock-keyhole" x="99" y="109" width="2" height="6" fill="white"/>

        <!-- Éclairs décoratifs -->
        <circle class="sparkle sparkle-1" cx="45" cy="55" r="2" fill="#3b82f6"/>
        <circle class="sparkle sparkle-2" cx="160" cy="70" r="1.5" fill="#8b5cf6"/>
        <circle class="sparkle sparkle-3" cx="155" cy="150" r="2" fill="#3b82f6"/>
        <circle class="sparkle sparkle-4" cx="50" cy="145" r="1.5" fill="#8b5cf6"/>

        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Titre -->
    <h1 class="title">Accès non autorisé</h1>

    <!-- Sous-titre -->
    <p class="subtitle">
      Vous n'avez pas les permissions nécessaires pour consulter cette page.
      Veuillez contacter votre administrateur si vous pensez qu'il s'agit d'une erreur.
    </p>

    <!-- Informations sur le rôle -->
    <div class="role-info" *ngIf="userRole">
      <div class="role-item">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4M12 8h.01"/>
        </svg>
        <span class="role-label">Votre rôle :</span>
        <span class="badge" [ngClass]="'badge-' + userRole.toLowerCase()">
          Employé
        </span>
      </div>

      <div class="role-item" *ngIf="requiredRoles.length > 0">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span class="role-label">Rôle requis :</span>
        <span class="badge badge-required">Administrateur, Directeur ou Rh</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-outline" (click)="goBack()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Retour</span>
      </button>

      <button class="btn btn-primary" (click)="goHome()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Tableau de bord</span>
      </button>
    </div>

    <!-- Footer discret -->
    <div class="footer-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Code de sécurité : <strong>ERR_403_UNAUTHORIZED</strong></span>
    </div>
  </div>
</div>
