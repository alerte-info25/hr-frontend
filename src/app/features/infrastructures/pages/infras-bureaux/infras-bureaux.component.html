@if (isLoading) {
<app-infras-loading ></app-infras-loading>
}
<div class="roles-header">
  <h1>Liste des bureaux</h1>
  <button class="btn-add" (click)="synchronize()">
    <i class="fas fa-sync-alt me-2"></i> Recharger les bureaux
  </button>
</div>
<div class="roles-list">
  @for (bureau of bureaux; track bureau.id) {
    <div class="role-item">
      <div class="role-info">
        <h4>{{ bureau.acronyme }}</h4>
        <p>{{ bureau.nom }}</p>
      </div>
      <div class="role-actions">
      </div>
    </div>
  } @empty {
    <div class="empty-state" align="center">
      <h3 class="empty-title">Aucun bureau disponible</h3>
      <p class="empty-description">Il n'y a actuellement aucun bureau défini dans le système.</p>
      <button class="btn btn-primary mt-3" (click)="synchronize()">
        <i class="fas fa-sync-alt me-2"></i>
        Charger les bureaux
      </button>
    </div>
  }
</div>
